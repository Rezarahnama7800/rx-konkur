
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>REZX | Financial Management</title>

<style>
:root{
  --bg:#050505;
  --white:#f5f5f5;
  --muted:#777;
}

*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  background:var(--bg);
  color:var(--white);
  font-family:Tahoma,Arial,sans-serif;
  overflow-x:hidden;
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  z-index:-2;
  pointer-events:none;
  background:
    radial-gradient(circle at 20% 15%,#171717,transparent 35%),
    radial-gradient(circle at 80% 80%,#101010,transparent 30%);
}

body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-1;
  pointer-events:none;
  opacity:.025;
  background-image:
    linear-gradient(#fff 1px,transparent 1px),
    linear-gradient(90deg,#fff 1px,transparent 1px);
  background-size:80px 80px;
}

.language-switch{
  position:fixed;
  top:22px;
  right:22px;
  z-index:10;
  width:48px;
  height:38px;
  border:1px solid #333;
  border-radius:30px;
  background:rgba(10,10,10,.88);
  color:#aaa;
  font:20px Arial,sans-serif;
  cursor:pointer;
  transition:.3s;
}

.language-switch:hover{
  color:#fff;
  border-color:#888;
}

.back-button{
  position:fixed;
  top:25px;
  left:25px;
  color:#777;
  text-decoration:none;
  font:11px Arial,Tahoma,sans-serif;
  letter-spacing:1px;
  transition:.3s;
}

.back-button:hover{color:#fff}

.page{
  min-height:100vh;
  padding:130px 7% 80px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}

.heading{
  text-align:center;
  margin-bottom:65px;
  animation:reveal .8s both;
}

.heading h1{
  font:900 clamp(32px,6vw,65px)/1.1 Arial,Tahoma,sans-serif;
  letter-spacing:1px;
  background:linear-gradient(100deg,#666,#fff,#777);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
}

.heading p{
  margin-top:16px;
  color:#777;
  font-size:12px;
  letter-spacing:3px;
}

.options{
  width:min(950px,100%);
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.option{
  min-height:190px;
  position:relative;
  isolation:isolate;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:20px;
  padding:25px 15px;
  text-decoration:none;
  color:#ddd;
  border:1px solid rgba(255,255,255,.13);
  background:linear-gradient(
    145deg,
    rgba(255,255,255,.065),
    rgba(255,255,255,.008)
  );
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
  transition:.35s ease;
  animation:reveal .8s both;
}

.option:nth-child(1){animation-delay:.15s}
.option:nth-child(2){animation-delay:.3s}
.option:nth-child(3){animation-delay:.45s}

.option:hover{
  color:#fff;
  border-color:rgba(255,255,255,.5);
  background:rgba(255,255,255,.055);
  box-shadow:
    0 15px 40px rgba(0,0,0,.4),
    0 0 25px rgba(255,255,255,.035);
  transform:translateY(-7px);
}

.option-number{
  color:#666;
  font:11px Arial,sans-serif;
  letter-spacing:3px;
}

.option-title{
  font:700 19px Arial,Tahoma,sans-serif;
  letter-spacing:1px;
  text-align:center;
}

.option-symbol{
  color:#aaa;
  font:42px Arial,sans-serif;
  line-height:1;
}

.option-subtitle{
  color:#666;
  font:9px Arial,sans-serif;
  letter-spacing:2px;
}

@keyframes reveal{
  from{opacity:0;transform:translateY(18px);filter:blur(5px)}
  to{opacity:1;transform:translateY(0);filter:blur(0)}
}

@media(max-width:700px){
  .back-button{top:25px;left:15px;font-size:9px}
  .language-switch{top:14px;right:14px;width:43px;height:35px}

  .page{padding:110px 7% 60px}

  .heading{margin-bottom:40px}

  .options{
    grid-template-columns:1fr;
    max-width:400px;
    gap:13px;
  }

  .option{min-height:135px}
  .option-title{font-size:17px}
  .option-symbol{font-size:34px}
}

@media(prefers-reduced-motion:reduce){
  .option,.heading{animation:none}
  *,*::before,*::after{transition-duration:.01ms!important}
}
</style>
</head>

<body>

<button class="language-switch" id="languageSwitch" type="button">EN</button>

<a href="index.html" class="back-button"
   data-fa="بازگشت به REZX"
   data-en="BACK TO REZX">بازگشت به REZX</a>

<main class="page">

  <header class="heading">
    <h1 data-fa="مدیریت مالی" data-en="FINANCIAL MANAGEMENT">مدیریت مالی</h1>
    <p>REZX DIVISIONS</p>
  </header>

  <section class="options">

    <a href="trading.html" class="option">
      <span class="option-number">01 / DIVISION</span>
      <span class="option-title">TRADING</span>
      <span class="option-subtitle">MARKET INTELLIGENCE</span>
    </a>

    <a href="finance-02.html" class="option">
      <span class="option-number">02 / DIVISION</span>
      <span class="option-symbol">×</span>
    </a>

    <a href="finance-03.html" class="option">
      <span class="option-number">03 / DIVISION</span>
      <span class="option-symbol">×</span>
    </a>

  </section>

</main>

<script>
const languageSwitch = document.getElementById("languageSwitch");
let currentLanguage = "fa";

function setLanguage(language){
  currentLanguage = language;

  document.documentElement.lang = language;
  document.documentElement.dir = language === "fa" ? "rtl" : "ltr";

  document.querySelectorAll("[data-fa][data-en]").forEach(element => {
    element.textContent = element.dataset[language];
  });

  languageSwitch.textContent = language === "fa" ? "EN" : "FA";
}

languageSwitch.addEventListener("click", () => {
  setLanguage(currentLanguage === "fa" ? "en" : "fa");
});
</script>

</body>
</html>

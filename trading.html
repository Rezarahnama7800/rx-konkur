
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>REZX — معامله‌گری</title>

<style>
:root{
  --bg:#050505;
  --white:#f2f2f2;
  --muted:#777;
  --line:rgba(255,255,255,.13);
}

*{margin:0;padding:0;box-sizing:border-box}

html{scroll-behavior:smooth;direction:rtl}

body{
  background:var(--bg);
  color:var(--white);
  font-family:Tahoma,Arial,sans-serif;
  overflow-x:hidden;
  direction:rtl;
}

/* BACKGROUND */

.market-bg{
  position:fixed;
  inset:0;
  z-index:-5;
  pointer-events:none;
  overflow:hidden;
}

.market-bg::before{
  content:"";
  position:absolute;
  inset:0;
  opacity:.035;
  background-image:
    linear-gradient(rgba(255,255,255,.7) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.7) 1px,transparent 1px);
  background-size:65px 65px;
}

.market-bg::after{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 50% 48%,rgba(255,255,255,.045),transparent 35%),
    radial-gradient(circle at 15% 20%,rgba(255,255,255,.025),transparent 30%),
    radial-gradient(circle at 85% 75%,rgba(255,255,255,.025),transparent 30%);
}

/* TRADING CHART BACKGROUND */

.chart-background{
  position:fixed;
  inset:0;
  z-index:-3;
  pointer-events:none;
  opacity:.16;
  overflow:hidden;
}

.chart-background svg{
  width:100%;
  height:100%;
}

.chart-grid{
  stroke:rgba(255,255,255,.12);
  stroke-width:1;
  stroke-dasharray:3 9;
}

.chart-line{
  fill:none;
  stroke:rgba(190,190,190,.45);
  stroke-width:1.5;
  stroke-dasharray:5 7;
}

.chart-area{
  fill:url(#chartGradient);
  opacity:.25;
}

.candle-up{
  fill:rgba(210,210,210,.55);
  stroke:rgba(230,230,230,.7);
}

.candle-down{
  fill:rgba(80,80,80,.5);
  stroke:rgba(170,170,170,.6);
}

.candle-wick{
  stroke:rgba(200,200,200,.5);
  stroke-width:1;
}

/* BACK BUTTON */

.back-button{
  position:fixed;
  top:22px;
  left:28px;
  z-index:101;
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px 16px;
  color:#aaa;
  text-decoration:none;
  font:11px Tahoma,Arial,sans-serif;
  letter-spacing:0;
  direction:rtl;
  background:rgba(8,8,8,.75);
  border:1px solid rgba(255,255,255,.12);
  backdrop-filter:blur(14px);
  transition:.3s ease;
}

.back-button:hover{
  color:#fff;
  border-color:rgba(255,255,255,.45);
  transform:translateX(-4px);
}

/* MAIN LAYOUT */

.trading-page{
  min-height:100vh;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:120px 8% 100px;
  direction:ltr;
}

/* CENTER TRADING TITLE */

.trading-core{
  position:absolute;
  z-index:5;
  left:50%;
  top:50%;
  width:min(600px,70vw);
  aspect-ratio:1;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  direction:ltr;
  unicode-bidi:isolate;
  transform:translate(-50%,-50%);
  pointer-events:none;
}

.core-content{
  position:relative;
  z-index:2;
  direction:rtl;
  text-align:center;
  width:100%;
}

.core-label{
  color:#777;
  font:11px Tahoma,Arial,sans-serif;
  letter-spacing:0;
  margin-bottom:22px;
  direction:rtl;
  white-space:nowrap;
}

.trading-core h1{
  display:block;
  width:100%;
  text-align:center;
  white-space:nowrap;
  direction:ltr;
  unicode-bidi:isolate;
  font:900 clamp(54px,8vw,112px)/1 Arial,sans-serif;
  letter-spacing:-5px;
  background:linear-gradient(110deg,#444,#f5f5f5 48%,#666);
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  padding:5px 0;
}

.core-line{
  width:100px;
  height:1px;
  background:#666;
  margin:30px auto 0;
}

/* DIVISION PANELS */

.division{
  position:absolute;
  z-index:10;
  width:min(310px,27vw);
  min-height:225px;
  padding:30px 28px;
  text-decoration:none;
  color:inherit;
  direction:rtl;
  display:flex;
  flex-direction:column;
  justify-content:center;
  text-align:center;
  overflow:hidden;
  background:linear-gradient(
    145deg,
    rgba(255,255,255,.085),
    rgba(255,255,255,.018) 55%,
    rgba(255,255,255,.035)
  );
  border:1px solid rgba(255,255,255,.16);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.07),
    0 15px 45px rgba(0,0,0,.2);
  transition:
    border-color .4s ease,
    background .4s ease,
    box-shadow .4s ease,
    opacity .4s ease,
    filter .4s ease,
    translate .4s ease;
  opacity:0;
  translate:0 24px;
  animation:panelReveal .9s cubic-bezier(.2,.75,.25,1) forwards;
}

.learning{animation-delay:.2s}
.risk{animation-delay:.4s}
.psychology{animation-delay:.6s}

@keyframes panelReveal{
  0%{
    opacity:0;
    translate:0 24px;
    filter:blur(8px);
  }
  100%{
    opacity:1;
    translate:0 0;
    filter:blur(0);
  }
}

/* PANEL LIGHT EFFECT */

.division::before{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    115deg,
    transparent 15%,
    rgba(255,255,255,.075) 45%,
    transparent 75%
  );
  transform:translateX(-120%);
  transition:transform .8s ease;
  pointer-events:none;
}

.division:hover::before{
  transform:translateX(120%);
}

.division::after{
  content:"";
  position:absolute;
  top:-1px;
  left:-1px;
  width:38px;
  height:38px;
  border-top:2px solid #aaa;
  border-left:2px solid #aaa;
  opacity:.55;
  transition:.4s ease;
  pointer-events:none;
}

.division:hover{
  border-color:rgba(255,255,255,.55);
  background:rgba(255,255,255,.075);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.13),
    0 20px 65px rgba(0,0,0,.55),
    0 0 28px rgba(255,255,255,.045);
  translate:0 -8px;
}

.division:hover::after{
  width:60px;
  height:60px;
  opacity:1;
}

.trading-page:has(.division:hover) .division:not(:hover){
  opacity:.4;
  filter:blur(1px);
}

/* PANEL POSITIONS */

.learning{
  left:6%;
  top:23%;
}

.risk{
  right:6%;
  top:23%;
}

.psychology{
  left:50%;
  bottom:9%;
  transform:translateX(-50%);
}

.psychology:hover{
  transform:translateX(-50%);
}

/* PANEL CONTENT */

.panel-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  width:100%;
  color:#999;
  font:12px Tahoma,Arial,sans-serif;
  font-weight:600;
  letter-spacing:0;
}

.panel-top span:first-child{
  font-size:12px;
  font-weight:600;
  letter-spacing:0;
}

.panel-icon{
  font-size:21px;
  color:#aaa;
  flex-shrink:0;
  transition:.4s ease;
}

.division:hover .panel-icon{
  color:#fff;
  transform:scale(1.2) rotate(10deg);
}

.division h2{
  margin-top:30px;
  font:800 24px/1.7 Tahoma,Arial,sans-serif;
  letter-spacing:0;
  color:#eee;
  text-align:center;
  transition:color .3s ease;
}

.division:hover h2{color:#fff}

/* PANEL ALIGNMENT */

.learning,
.risk,
.psychology{
  text-align:center;
}

.learning .panel-top,
.risk .panel-top,
.psychology .panel-top{
  direction:rtl;
}

/* NETWORK CONNECTIONS */

.network{
  position:absolute;
  inset:0;
  z-index:2;
  pointer-events:none;
}

.network svg{
  width:100%;
  height:100%;
}

.network line{
  stroke:rgba(255,255,255,.09);
  stroke-width:1;
  stroke-dasharray:5 9;
}

.network circle{
  fill:#888;
  opacity:.4;
}

/* REZX CINEMATIC TRANSITION */

.page-transition{
  position:fixed;
  inset:0;
  z-index:99999;
  pointer-events:none;
  opacity:0;
  visibility:hidden;
  overflow:hidden;
  background:
    radial-gradient(
      circle at 50% 50%,
      rgba(255,255,255,.12),
      transparent 35%
    ),
    #030303;
}

.page-transition::before{
  content:"";
  position:absolute;
  top:-30%;
  left:-80%;
  width:45%;
  height:160%;
  transform:skewX(-18deg);
  background:linear-gradient(
    90deg,
    transparent,
    rgba(255,255,255,.025) 25%,
    rgba(255,255,255,.8) 50%,
    rgba(255,255,255,.08) 75%,
    transparent
  );
  filter:blur(8px);
}

.page-transition::after{
  content:"";
  position:absolute;
  inset:0;
  opacity:0;
  background:radial-gradient(
    circle at center,
    transparent 0,
    rgba(0,0,0,.3) 35%,
    #000 100%
  );
}

.page-transition.is-entering{
  visibility:visible;
  animation:rezxEnter .95s cubic-bezier(.76,0,.24,1) forwards;
}

.page-transition.is-entering::before{
  animation:rezxLight .95s cubic-bezier(.65,0,.25,1) forwards;
}

.page-transition.is-entering::after{
  animation:rezxVignette .95s ease forwards;
}

.page-transition.is-leaving{
  visibility:visible;
  animation:rezxExit .65s cubic-bezier(.7,0,.2,1) forwards;
}

.page-transition.is-leaving::before{
  animation:rezxLight .65s cubic-bezier(.65,0,.25,1) forwards;
}

.page-transition.is-leaving::after{
  animation:rezxVignette .65s ease forwards;
}

@keyframes rezxEnter{
  from{opacity:1}
  to{opacity:0}
}

@keyframes rezxExit{
  from{opacity:0}
  to{opacity:1}
}

@keyframes rezxLight{
  from{left:-80%}
  to{left:140%}
}

@keyframes rezxVignette{
  0%{opacity:.15}
  50%{opacity:.8}
  100%{opacity:0}
}

/* MOBILE */

@media(max-width:800px){

  .back-button{
    top:auto;
    bottom:15px;
    left:15px;
  }

  .trading-page{
    min-height:auto;
    padding:105px 7% 100px;
    flex-direction:column;
    gap:22px;
  }

  .trading-core{
    position:relative;
    left:auto;
    top:auto;
    width:min(440px,100%);
    aspect-ratio:1;
    margin-bottom:5px;
    transform:none;
  }

  .trading-core h1{
    font-size:clamp(58px,13vw,100px);
    letter-spacing:-4px;
  }

  .division{
    position:relative;
    width:100%;
    max-width:480px;
    min-height:190px;
    left:auto !important;
    right:auto !important;
    top:auto !important;
    bottom:auto !important;
    transform:none !important;
  }

  .division:hover{transform:none !important}

  .network{display:none}

  .chart-background{opacity:.12}

  .page-transition::before{
    width:65%;
    filter:blur(12px);
  }
}

@media(max-width:420px){

  .back-button{
    font-size:10px;
    padding:10px 12px;
  }

  .division h2{font-size:22px}

  .panel-top,
  .panel-top span:first-child{
    font-size:11px;
  }

  .core-label{
    font-size:10px;
  }
}

/* REDUCED MOTION */

@media(prefers-reduced-motion:reduce){
  .division{
    animation:none;
    opacity:1;
    translate:0 0;
  }

  .page-transition{display:none}

  *,
  *::before,
  *::after{
    scroll-behavior:auto !important;
    transition-duration:.01ms !important;
  }
}
</style>
</head>

<script>
/* REZX CINEMATIC TRANSITION ENGINE */

(() => {
  const overlay = document.getElementById("pageTransition");
  if (!overlay) return;

  const reducedMotion = window.matchMedia(
    "(prefers-reduced-motion: reduce)"
  ).matches;

  if (reducedMotion) return;

  // ورود سینمایی به صفحه معامله‌گری
  requestAnimationFrame(() => {
    overlay.classList.add("is-entering");
  });

  overlay.addEventListener("animationend", event => {
    if (event.animationName === "rezxEnter") {
      overlay.classList.remove("is-entering");
      overlay.style.visibility = "hidden";
    }
  });

  // خروج سینمایی هنگام باز کردن صفحات دیگر
  document.addEventListener("click", event => {
    const link = event.target.closest("a");
    if (!link) return;

    const href = link.getAttribute("href");

    if (
      !href ||
      href.startsWith("#") ||
      href.startsWith("mailto:") ||
      href.startsWith("tel:") ||
      link.target === "_blank" ||
      event.ctrlKey ||
      event.metaKey ||
      event.shiftKey ||
      event.altKey
    ) return;

    const destination = new URL(href, window.location.href);

    if (
      destination.origin !== window.location.origin ||
      destination.href === window.location.href
    ) return;

    event.preventDefault();

    overlay.classList.remove("is-entering");
    overlay.style.visibility = "visible";

    void overlay.offsetWidth;

    overlay.classList.add("is-leaving");

    let navigated = false;

    const navigate = () => {
      if (navigated) return;
      navigated = true;
      window.location.href = destination.href;
    };

    overlay.addEventListener("animationend", animationEvent => {
      if (animationEvent.animationName === "rezxExit") {
        navigate();
      }
    }, { once:true });

    setTimeout(navigate, 850);
  });
})();
</script>
